<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tree of Artificial Life</title>
<link href="caratteri/caratteri.css" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
canvas{display:block;margin:0 auto;height:100vh;width:auto;max-width:100vw;cursor:zoom-in}
canvas.largo{height:auto;width:100%;max-width:1460px;cursor:zoom-out}
</style></head><body>
<canvas id="c"></canvas>
<script src="/meditazioni/middah.js"></script>
<script src="griglia.js"></script>
<script>
/* Le undici figure della Middah nei posti dell'Albero, su un'unica griglia. Ognuna si traccia da sé e, chiusa,
   continua a essere ripercorsa dalla sua linea: la figura resta, la luce gira. Un tocco ingrandisce. */
const Q=new URLSearchParams(location.search), CW=14, D=420, DX=450, DY=260, MARG=70, BANDA=110, VEL=+(Q.get("vel")||7), FPS=15;
const W=2*DX+D+2*MARG, H=Math.round(7.8*DY+D+2*MARG+BANDA), NC=Math.ceil(W/CW);
const CHIARO="236,242,252", LIEVE="127,162,220", MODI=["alterna","nodi","insieme","diventa"];
// i posti: colonna da sinistra a destra di chi guarda, riga dall'alto
const POSTI={"כתר":[0,0],"חכמה":[1,1],"בינה":[-1,1],"דעת":[0,2],"חסד":[1,3],"גבורה":[-1,3],"תפארת":[0,4],"נצח":[1,5],"הוד":[-1,5],"יסוד":[0,6],"מלכות":[0,7.8]};
const cifra=g=>g.length===1&&g>="1"&&g<="9";
function prepara(w,r,i){const F=Griglia.figuraDi(w,r),[px,py]=POSTI[w],cx=W/2+px*DX,cy=MARG+D/2+py*DY,s=D*0.47/F.raggio;
  const X=p=>cx+(p[0]-F.baricentro[0])*s,Y=p=>cy+(p[1]-F.baricentro[1])*s,tot=new Map();
  const passi=F.tratti.map(t=>{const ax=X(t.da),ay=Y(t.da),bx=X(t.a),by=Y(t.a),n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/2)),m=new Map();
    for(let k=0;k<=n;k++){const c=Math.floor((ax+(bx-ax)*k/n)/CW)+NC*Math.floor((ay+(by-ay)*k/n)/CW);m.set(c,(m.get(c)||0)+1);tot.set(c,(tot.get(c)||0)+1);}
    return {lettera:t.lettera,stanza:t.stanza,celle:[...m],capo:[bx,by]};});
  return {F,passi,max:Math.max(...tot.values())*0.7,modo:MODI[i%4],stato:new Map(),fatti:0};}
function avanza(A,fino){for(;A.fatti<fino;A.fatti++){const p=A.passi[A.fatti];p.celle.forEach(([k,n],i)=>{
    const g=A.modo==="alterna"?(i%2?String(p.stanza):p.lettera):A.modo==="nodi"?(i===0?String(p.stanza):p.lettera):p.lettera;
    let q=A.stato.get(k);if(!q){q={per:{},volte:[]};A.stato.set(k,q);}q.per[g]=(q.per[g]||0)+n;q.volte.push(A.fatti);});}}
const tela=document.getElementById("c");tela.width=W;tela.height=H;tela.onclick=()=>tela.classList.toggle("largo");
const x=tela.getContext("2d"),strato=document.createElement("canvas");strato.width=W;strato.height=H;const y=strato.getContext("2d");
let ALBERO=[],t0=0;
function quadro(ora){const t=(ora-t0)/1000,jf=Math.max(0,(t-1.6)*VEL),j=Math.floor(jf),lampo=Math.floor(t*2.2)%2===0;
  y.clearRect(0,0,W,H);y.textAlign="center";y.textBaseline="middle";
  for(const A of ALBERO){const tot=A.passi.length,jm=jf%tot;avanza(A,Math.min(j,tot));
    for(const [k,q] of A.stato){const px=(k%NC+0.5)*CW,py=(Math.floor(k/NC)+0.5)*CW;
      let eta=1e9;for(const v of q.volte){const e=((jm-v)%tot+tot)%tot;if(e<eta)eta=e;}
      const scia=Math.max(0,1-eta/18);
      for(const g0 in q.per){const v=Math.min(1,q.per[g0]/A.max),corpo=CW*(0.6+v*1.1);
        const g=A.modo==="diventa"&&scia>0.4?String(Middah.stanza(g0)):g0,alfa=Math.min(1,0.38+v*0.6+scia*0.7);
        y.font=cifra(g)?`${Math.round(corpo*0.8)}px "Space Mono"`:`${Math.round(corpo)}px "Frank Ruhl Libre"`;
        y.fillStyle=`rgba(${scia>0.3||v>0.65?CHIARO:LIEVE},${alfa})`;y.fillText(g,px,py);
        if(A.modo==="insieme"){y.font=`${Math.round(CW*(0.36+v*0.3))}px "Space Mono"`;y.fillStyle=`rgba(${LIEVE},${alfa*0.85})`;y.fillText(String(Middah.stanza(g0)),px+CW*0.36,py+CW*0.34);}}}
    if(j>0){const c=A.passi[(j-1)%tot].capo;y.fillStyle=`rgba(${CHIARO},0.95)`;y.fillRect(c[0]-CW*0.28,c[1]-CW*0.42,CW*0.56,CW*0.84);}}
  // la riga in fondo
  const riga="> tree of artificial life",n=Math.max(0,Math.min(riga.length,Math.floor(t*22)));
  y.textAlign="left";y.font=`24px "Space Mono"`;y.fillStyle=`rgba(${LIEVE},0.9)`;y.fillText(riga.slice(0,n),MARG,H-BANDA*0.55);
  if(lampo){y.fillStyle=`rgba(${CHIARO},0.9)`;y.fillText("▮",MARG+y.measureText(riga.slice(0,n)+" ").width,H-BANDA*0.55);}
  // fosforo sul nero, righe del tubo
  x.globalCompositeOperation="source-over";x.globalAlpha=1;x.filter="none";x.fillStyle="#010204";x.fillRect(0,0,W,H);
  x.globalCompositeOperation="lighter";x.filter="blur(8px)";x.globalAlpha=0.75;x.drawImage(strato,0,0);x.filter="none";
  x.globalAlpha=0.88+Math.random()*0.12;x.drawImage(strato,0,0);
  x.globalCompositeOperation="source-over";x.globalAlpha=1;x.fillStyle="rgba(0,0,0,0.3)";for(let r=0;r<H;r+=4)x.fillRect(0,r,W,1.6);
}
function avvio(){ALBERO=Griglia.SEFIROT.map(([w,r],i)=>prepara(w,r,i));t0=performance.now();
  let ultimo=0;(function giro(ora){if(ora-ultimo>1000/FPS){ultimo=ora;quadro(ora);}requestAnimationFrame(giro);})(performance.now());}
Griglia.pronti().then(avvio,avvio);
</script></body></html>
