<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Tavola 20, la voce vera</title>
<link href="caratteri/caratteri.css" rel="stylesheet">
<style>
body{margin:0;padding:22px 30px 40px;background:#000;color:#DCE6F7}
canvas{display:block;margin:0 auto;max-height:calc(100vh - 315px);max-width:100%;width:auto;height:auto;cursor:pointer}
.m{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA2DC;margin-top:10px;text-align:center}
.p{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 16px;align-items:baseline}
.p button{all:unset;cursor:pointer;font-family:"Frank Ruhl Libre",serif;font-size:22px;color:#7FA2DC;border-bottom:1px solid transparent}
.p button.qui{color:#ECF2FC;border-color:#7FA2DC}
.p a{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA2DC;cursor:pointer;border-bottom:1px solid transparent}.p a.qui{color:#ECF2FC;border-color:#7FA2DC}
#su{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#000;background:#7FA2DC;padding:10px 18px;margin:0 auto 14px;width:max-content;cursor:pointer}
#su.acceso{background:none;color:#7FA2DC;border:1px solid #2E4FA3;font-size:10px;padding:6px 12px}
.p small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:5px}
</style></head><body>
<div class="p" id="p"></div>
<div class="p" id="d"></div>
<div class="p" id="e"></div>
<div class="p" id="f"></div>
<div id="su">♪ tocca qui per accendere il suono</div>
<canvas id="c"></canvas>
<div class="m" id="et"></div>
<script src="/meditazioni/middah.js"></script>
<script src="griglia.js?v=2"></script>
<script>
/* Polvere: la famiglia di una sefirah come pulviscolo di lettere. Due strati di granelli lungo la linea, un nucleo
   stretto e chiaro e un alone largo, minuto e lieve. I granelli non si spengono mai: quando viene la sorella
   ognuno migra al suo posto nuovo. Un tocco passa subito alla sorella.
   ?n= parola da 0 a 10, ?granelli= quanti, ?tieni= e ?migra= secondi, ?alone= larghezza dell'alone in punti,
   ?nebbia= quanto è sparsa la polvere, 1 è la prima versione, ?sfuma= quanto si allarga nel passaggio, 0 lo spegne. */
const Q=new URLSearchParams(location.search), L=1600, FPS=20, M=+(Q.get("granelli")||4000), TIENI=+(Q.get("tieni")||10), MIGRA=+(Q.get("migra")||12), ALONE=+(Q.get("alone")||46), NEBBIA=+(Q.get("nebbia")||1.35), SFUMA=+(Q.get("sfuma")||2.4);
const CHIARO="236,242,252", LIEVE="127,162,220";
const tela=document.getElementById("c");tela.width=tela.height=L;const x=tela.getContext("2d"),s0=document.createElement("canvas");s0.width=s0.height=L;const y=s0.getContext("2d");
const dolce=e=>e*e*(3-2*e), caso=(()=>{let s=11;return()=>(s=(s*16807)%2147483647)/2147483647;})(), campana=()=>caso()+caso()+caso()-1.5;
// ogni granello: scarto dalla linea, fase, passo dell'oscillazione, corpo, luce. Uno su tre sta nel nucleo, gli altri nell'alone
const G=Array.from({length:M},(_, i)=>{const nucleo=i%3===0,larg=(nucleo?9:ALONE)*NEBBIA;return {dx:campana()*larg,dy:campana()*larg,f:caso()*6.28,w:0.2+caso()*0.45,
  c:nucleo?Math.round(15+caso()*caso()*26):Math.round(8+caso()*9),a:nucleo?0.3+caso()*0.55:0.08+caso()*0.22,nucleo};});
let quale=0,KK=[],ki=0,A,B,t0=0;
/* La musica. Ogni tratto è una nota. La stanza della lettera, da 1 a 9, è la durata, come è la lunghezza del tratto.
   L'altezza viene dalla vocale con cui la lettera si pronuncia. La direzione della linea sposta il grado: a ogni svolta
   il motivo sale, e quando la figura si chiude è tornato all'inizio. La svolta della figura dà la tonica.
   La figura resta finché la parola è stata suonata un numero intero di volte, poi la polvere migra e il bordone
   scivola alla tonica della sorella. */
const LUCE=+(Q.get("luce")||0); // quanto la nota accende i granelli del suo tratto: spenta, scelta di Dome
const UNITA=+(Q.get("unita")||0.2), BASE=110;
let AC=null,USCITA,BORD=[],FA=null,acceso=[],nj=0,prossima=0,tieni=TIENI;
const ottava=c=>Math.floor(Middah.AB.indexOf(Middah.FIN[c]||c)/9);
const tonica=F=>BASE*Math.pow(2,F.theta_gradi/360);
// la nota di un tratto: la stanza della lettera dà il grado, la direzione in cui la linea sta andando lo sposta.
// A ogni svolta il motivo della parola sale di un poco lungo la scala, e quando la figura si chiude è tornato da dove era partito.
const PENTA=[0,3,5,7,10];
/* Le vocali come toni, alla maniera di Abulafia: il punto vocalico è la nota. Da Idel: il holam, che sta sopra la lettera,
   è il tono alto, il hiriq, che sta sotto, il tono basso. Gli altri tre li ho messi in mezzo secondo il posto del segno:
   shuruq al centro, poi qamatz e patach, poi segol e tzere; questo ordine di mezzo è una mia deduzione, non una fonte.
   Una lettera senza vocale propria, con lo shva, muta o in fine di parola, risuona piano sul tono della vocale vicina. */
const VOCALI={"כתר":"ss-","חכמה":"q-q-","בינה":"h-q-","חסד":"ss-","גבורה":"-u-q-","תפארת":"h-ss-","נצח":"sp-","הוד":"o--","יסוד":"-o--","מלכות":"p-u--","דעת":"pp-"};
const GRADO={h:0,s:1,q:2,p:2,u:3,o:5}, NOME={h:"hiriq",s:"segol",q:"qamatz",p:"patach",u:"shuruq",o:"holam","-":"senza vocale"};
function tono(F,i){const v=VOCALI[F.parola]||"";let k=i;if(!GRADO.hasOwnProperty(v[i])){k=-1;for(let j=i-1;j>=0;j--)if(GRADO.hasOwnProperty(v[j])){k=j;break;}if(k<0)for(let j=i+1;j<v.length;j++)if(GRADO.hasOwnProperty(v[j])){k=j;break;}}
  return {grado:k<0?0:GRADO[v[k]],piena:k===i,segno:v[i]||"-"};}
const freq=(F,i,n=0)=>{const dir=((n*F.theta_gradi)%360+360)%360,g=tono(F,i).grado+Math.floor(dir/360*5+1e-6);return tonica(F)*Math.pow(2,(PENTA[g%5]+12*Math.floor(g/5))/12);};
function accendi(){if(AC){AC.state==="running"?AC.suspend():AC.resume();return;}
  AC=new AudioContext();USCITA=AC.createGain();USCITA.gain.value=+(Q.get("volume")||0.9);USCITA.connect(AC.destination);
  const eco=AC.createConvolver(),n=AC.sampleRate*5,imp=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}
  eco.buffer=imp;const bagnato=AC.createGain();bagnato.gain.value=0.55;USCITA.connect(eco);eco.connect(bagnato);bagnato.connect(AC.destination);ECO=eco;caricaCoro().catch(e=>console.warn("coro non caricato",e));
  for(const [rapporto,vol] of [[1,0.05],[1.5,0.022],[2,0.016]]){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=tonica(FA)*rapporto;g.gain.value=vol;o.connect(g);g.connect(USCITA);o.start();BORD.push([o,rapporto]);}}
// una voce morbida, senza colpo d'attacco: entra piano, resta, si spegne a lungo. Unità, decine e centinaia cambiano il colore, dal più scuro al più chiaro
/* La voce che canta. Una voce si riconosce dalle sue formanti: tre risonanze della bocca che cambiano da vocale a vocale.
   Qui una sorgente ricca passa per tre filtri accordati sulla vocale del segno, con un vibrato lieve che entra dopo l'attacco.
   Le lettere senza vocale sono un mormorio a bocca chiusa. Non pronuncia le consonanti: canta le vocali, che è ciò che dà il tono. */
let CANTO=Q.get("canto")||"vera",ECO=null,VOCE=null,CORO=null;
const BOCCA={h:[[290,1],[2250,1.1],[3000,0.7]],s:[[480,1],[1800,1],[2500,0.6]],q:[[720,1],[1150,0.9],[2600,0.5]],p:[[740,1],[1200,0.9],[2600,0.5]],u:[[320,1],[760,0.7],[2400,0.25]],o:[[470,1],[850,0.8],[2600,0.3]],"-":[[250,1],[1000,0.08],[2300,0.03]]};
function uscitaVoce(){if(!VOCE){VOCE=AC.createGain();VOCE.gain.value=USCITA.gain.value;VOCE.connect(AC.destination);const manda=AC.createGain();manda.gain.value=+(Q.get("eco")||0.3);VOCE.connect(manda);manda.connect(ECO);}}
/* La voce vera. Il campionario cantato da una voce di ElevenLabs, voce/campionario_voce.mp3, dà il timbro: una vocale tenuta
   per ognuno dei sei suoni. Il cambio di voce non ha seguito le note, quindi l'intonazione la faccio qui: di ogni vocale
   ritaglio i singoli periodi della gola, uno per uno, e li rimetto in fila alla distanza che dà la nota voluta.
   Il timbro resta quello della voce, l'altezza è la nostra. */
async function caricaCoro(){const [a,j]=await Promise.all([fetch("voce/campionario_voce.mp3").then(r=>r.arrayBuffer()),fetch("voce/campionario_voce.json").then(r=>r.json())]);
  const b=await AC.decodeAudioData(a),x=b.getChannelData(0),sr=b.sampleRate,fonti={};
  for(const v in j.fonti){const {da,f0,rms}=j.fonti[v],T=sr/f0,ini=Math.floor((da+0.35)*sr),fin=Math.floor((da+1.45)*sr),segni=[];
    let m=ini;for(let i=ini;i<ini+2*T;i++)if(x[i]>x[m])m=i;
    while(m<fin){segni.push(m);const lo=Math.floor(m+0.8*T),hi=Math.floor(m+1.2*T);let p=lo;for(let i=lo;i<=hi;i++)if(x[i]>x[p])p=i;m=p;}
    fonti[v]={segni,T,livello:0.2/rms};}
  CORO={x,sr,fonti};}
const MEMO=new Map();
function coro(f,dura,forza,segno){const v={h:"i",s:"e",q:"a",p:"a",u:"u",o:"o"}[segno]||"m",F=CORO.fonti[v],sr=CORO.sr,x=CORO.x,chiave=v+"|"+Math.round(f)+"|"+dura;
  let buf=MEMO.get(chiave);
  if(!buf){const n=Math.floor((dura+0.42)*sr),y=new Float32Array(n),T=Math.round(F.T),M=F.segni.length-1;let t=T;
    while(t<n-T-1){const sec=t/sr,trema=1+0.009*Math.min(1,Math.max(0,(sec-0.3)/0.4))*Math.sin(2*Math.PI*5.1*sec),sale=1-0.03*Math.exp(-sec/0.04);
      let i=Math.floor(t/F.T)%(2*M);if(i>=M)i=2*M-1-i;const c=F.segni[i],o=Math.floor(t);
      for(let q=-T;q<T;q++)y[o+q]+=x[c+q]*(0.5+0.5*Math.cos(Math.PI*q/T));
      t+=sr/(f*trema*sale);}
    const g=F.livello*Math.pow((sr/f)/F.T,0.75),entra=0.09*sr,esce=0.3*sr,tieni=dura*sr;
    for(let i=0;i<n;i++)y[i]*=g*Math.min(1,i/entra)*(i<entra+tieni?1:Math.max(0,1-(i-entra-tieni)/esce));
    buf=AC.createBuffer(1,n,sr);buf.copyToChannel(y,0);MEMO.set(chiave,buf);if(MEMO.size>500)MEMO.delete(MEMO.keys().next().value);}
  uscitaVoce();const sorg=AC.createBufferSource(),gg=AC.createGain();sorg.buffer=buf;gg.gain.value=0.9*forza;sorg.connect(gg);gg.connect(VOCE);sorg.start();}
function canta(f,dura,forza,segno){const t=AC.currentTime,g=AC.createGain(),entra=0.09,esce=0.22,fine=t+entra+dura+esce*5,picco=0.55*forza;
  // la voce esce quasi asciutta, con poca eco, altrimenti le vocali si impastano; e il bordone si abbassa sotto di lei
  uscitaVoce();
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(picco,t+entra);g.gain.setTargetAtTime(picco*0.85,t+entra,0.3);g.gain.setTargetAtTime(0.0001,t+entra+dura,esce);g.connect(VOCE);
  const trema=AC.createOscillator(),quanto=AC.createGain();trema.frequency.value=5+Math.random()*0.7;quanto.gain.setValueAtTime(0,t);quanto.gain.linearRampToValueAtTime(f*0.011,t+entra+0.3);trema.connect(quanto);trema.start(t);trema.stop(fine);
  const filtri=(BOCCA[segno]||BOCCA["-"]).map(([fc,v],i)=>{const b=AC.createBiquadFilter(),h=AC.createGain();b.type="bandpass";b.frequency.value=fc;b.Q.value=[9,13,15][i];h.gain.value=v*[1,2.2,3.2][i];b.connect(h);h.connect(g);return b;});
  // la sorgente: due denti di sega appena scordati, che attaccano un poco sotto la nota e ci salgono, come fa una gola
  for(const scarto of [-4,5]){const o=AC.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(f*0.965,t);o.frequency.exponentialRampToValueAtTime(f,t+0.09);o.detune.value=scarto;quanto.connect(o.frequency);for(const b of filtri)o.connect(b);o.start(t);o.stop(fine);}}
function nota(f,dura,ordine,forza,segno){if(!AC||AC.state!=="running")return;if(CANTO==="vera"&&CORO)return coro(f,dura,forza,segno);if(CANTO!=="morbido")return canta(f,dura,forza,segno);const t=AC.currentTime,g=AC.createGain(),entra=0.14,coda=2.6+dura*2.5,picco=0.2*forza;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(picco,t+entra);g.gain.setTargetAtTime(picco*0.55,t+entra,dura*0.8+0.2);g.gain.setTargetAtTime(0.0001,t+entra+dura,coda/4);g.connect(USCITA);
  for(const [m,v,scarto] of [[1,1,0],[1,0.6,4],[2,[0.06,0.14,0.24][ordine],0],[0.5,0.25,0]]){const o=AC.createOscillator(),h=AC.createGain();o.type="sine";o.frequency.value=f*m;o.detune.value=scarto;h.gain.value=v;o.connect(h);h.connect(g);o.start(t);o.stop(t+entra+dura+coda);}}
// una figura nuova è in vista: da capo la parola, e quante volte suonarla
function intona(F,t){FA=F;acceso=new Array(F.tratti.length).fill(-99);nj=0;prossima=t+0.4;const parola=F.somma_stanze*UNITA;tieni=Math.max(1,Math.round(TIENI/parola))*parola+0.6;
  if(AC)for(const [o,rapporto] of BORD)o.frequency.setTargetAtTime(tonica(F)*rapporto,AC.currentTime,MIGRA/4);}
const figura=i=>{const [w,r]=Griglia.SEFIROT[quale];return Middah.figura(w,{r,k:KK[((i%KK.length)+KK.length)%KK.length]});};
function granelli(F){const s=L*0.4/F.raggio,X=p=>L/2+(p[0]-F.baricentro[0])*s,Y=p=>L/2+(p[1]-F.baricentro[1])*s,tot=F.numeri.lunghezza,out=[];let t=0,fatta=0;
  for(let i=0;i<M;i++){const d=(i+0.5)/M*tot;while(t<F.tratti.length-1&&fatta+F.tratti[t].stanza<d){fatta+=F.tratti[t].stanza;t++;}
    const T=F.tratti[t],u=(d-fatta)/T.stanza;out.push([X(T.da)+(X(T.a)-X(T.da))*u,Y(T.da)+(Y(T.a)-Y(T.da))*u,T.lettera,t]);}
  return out;}
function etichetta(){const F=figura(ki);document.getElementById("et").innerHTML=`figura ${((ki%KK.length)+KK.length)%KK.length+1} di ${KK.length} · svolta ${Griglia.virgola(F.theta_gradi,1)}° · tonica ${Math.round(tonica(F))} Hz &nbsp;·&nbsp; `+F.lettere.map((c,i)=>`<span dir="ltr" style="unicode-bidi:isolate;white-space:nowrap"><bdi style="font-family:'Frank Ruhl Libre';font-size:17px;color:#ECF2FC">${c}</bdi> ${NOME[tono(F,i).segno]}, lunga ${Middah.stanza(c)}, ${Math.round(freq(F,i))} Hz</span>`).join(" &nbsp;·&nbsp; ");}
function quadro(t){let e=(t-t0-tieni)/MIGRA;if(e>=1){ki++;A=B;B=granelli(figura(ki+1));t0=t;e=-1;etichetta();intona(figura(ki),t);}
  // le note: una per tratto, lunga quanto il tratto; durante la migrazione continuano più piano
  if(FA){if(t-prossima>2)prossima=t;while(t>=prossima){const n=nj%FA.tratti.length,T=FA.tratti[n];nota(freq(FA,T.i,n),T.stanza*UNITA,ottava(T.lettera),(e<0?1:0.4)*(tono(FA,T.i).piena?1:0.38),tono(FA,T.i).piena?tono(FA,T.i).segno:"-");acceso[n]=t;prossima+=T.stanza*UNITA;nj++;}}
  e=e<0?0:dolce(e);
  y.clearRect(0,0,L,L);y.textAlign="center";y.textBaseline="middle";
  // nel passaggio la polvere si allarga in nebbia e poi si raccoglie sulla figura nuova
  const neb=1+SFUMA*Math.sin(Math.PI*e),vel=1-0.35*Math.sin(Math.PI*e);
  for(let i=0;i<M;i++){const a=A[i],b=B[i],g=G[i],luce=LUCE&&e<0.5?LUCE*Math.exp(-(t-(acceso[a[3]]??-99))/1.1):0,px=a[0]+(b[0]-a[0])*e+g.dx*neb+6*Math.sin(t*g.w+g.f),py=a[1]+(b[1]-a[1])*e+g.dy*neb+6*Math.cos(t*g.w*0.8+g.f);
    y.font=`${g.c}px "Frank Ruhl Libre"`;y.fillStyle=`rgba(${g.c>26||luce>0.25?CHIARO:LIEVE},${Math.min(1,g.a*(g.nucleo?vel:1)*(0.72+0.28*Math.sin(t*g.w*1.7+g.f*2))*(1+3*luce))})`;y.fillText(e<0.5?a[2]:b[2],px,py);}
  x.globalCompositeOperation="source-over";x.globalAlpha=1;x.filter="none";x.fillStyle="#000";x.fillRect(0,0,L,L);
  x.globalCompositeOperation="lighter";x.filter=`blur(${Math.round(34*NEBBIA)}px)`;x.globalAlpha=0.55;x.drawImage(s0,0,0);x.filter="blur(14px)";x.globalAlpha=0.6;x.drawImage(s0,0,0);x.filter="none";x.globalAlpha=1;x.drawImage(s0,0,0);}
function parola(i,ora){quale=i;const [w,r]=Griglia.SEFIROT[i],m=Middah.pulisci(w).length;KK=Middah.kAmmessi(r,m).filter(k=>k<=r*m/2);ki=Math.max(0,KK.indexOf(Griglia.kVicino(r,m)));
  // anche cambiando parola la polvere migra: la figura in vista resta il punto di partenza
  if(A&&ora!=null){ki--;B=granelli(figura(ki+1));t0=ora-tieni;}else{A=granelli(figura(ki));B=granelli(figura(ki+1));t0=performance.now()/1000;intona(figura(ki),t0);}
  etichetta();[...document.querySelectorAll("#p button")].forEach((b,n)=>b.classList.toggle("qui",n===i));}
function avvio(){const p=document.getElementById("p");
  Griglia.SEFIROT.forEach(([w,r,nome],i)=>{const b=document.createElement("button");b.innerHTML=`${w}<small>${nome}</small>`;b.onclick=()=>parola(i,performance.now()/1000);p.appendChild(b);});
  for(const c of [1,1.35,1.8,2.4]){const a=document.createElement("a");a.textContent="nebbia "+String(c).replace(".",",");if(c===NEBBIA)a.className="qui";a.onclick=()=>{location.search=`?n=${quale}&granelli=${M}&nebbia=${c}`;};document.getElementById("e").appendChild(a);}
  for(const c of [1500,4000,8000,14000]){const a=document.createElement("a");a.textContent=c+" granelli";if(c===M)a.className="qui";a.onclick=()=>{location.search=`?n=${quale}&granelli=${c}&nebbia=${NEBBIA}`;};document.getElementById("d").appendChild(a);}
  tela.onclick=()=>{const t=performance.now()/1000;if(t-t0<tieni)t0=t-tieni;};
  const su=document.getElementById("su"),scritta=()=>{const va=AC&&AC.state!=="suspended";su.textContent=va?"suono acceso · tocca per spegnere":"♪ tocca qui per accendere il suono";su.className=va?"acceso":"";};
  for(const [nome,v] of [["voce vera","vera"],["voce sintetica","sint"],["suono morbido","morbido"]]){const a=document.createElement("a");a.textContent=nome;if(v===CANTO)a.className="qui";a.onclick=()=>{CANTO=v;[...document.querySelectorAll("#f a")].forEach(x=>x.classList.toggle("qui",x===a));};document.getElementById("f").appendChild(a);}
  su.onclick=ev=>{ev.stopPropagation();accendi();setTimeout(scritta,150);};
  // il primo tocco in qualunque punto della pagina accende il suono
  document.addEventListener("pointerdown",ev=>{if(!AC&&ev.target!==su){accendi();setTimeout(scritta,150);}},{once:true});parola(+(Q.get("n")||0));
  let ultimo=0;(function giro(ora){if(ora-ultimo>1000/FPS){ultimo=ora;quadro(ora/1000);}requestAnimationFrame(giro);})(performance.now());}
Griglia.pronti().then(avvio,avvio);
</script></body></html>
