<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Tree of Artificial Life, i sentieri</title>
<link href="caratteri/caratteri.css" rel="stylesheet">
<style>
html,body{margin:0;background:#000;color:#DCE6F7;font-family:"Cormorant Garamond",serif}
.due{display:flex;justify-content:center;gap:3vw;padding:10px 0 0}
.due>div{width:min(46vw,calc((100vh - 90px)*0.541))}
.due.solo>div{width:min(100vw,1460px)}
canvas{display:block;width:100%;height:auto;cursor:pointer}
.m{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA2DC;margin-top:8px}
.r{font-style:italic;font-size:15px;color:#DCE6F7;margin-bottom:10px}
</style></head><body>
<div class="due" id="g"></div>
<script src="/meditazioni/middah.js"></script>
<script src="griglia.js"></script>
<script>
/* L'Albero con i ventidue sentieri, ognuno scritto con la sua lettera, in due attribuzioni a confronto.
   Le figure sono quelle della tavola 7. Un tocco apre un albero da solo, grande. */
const Q=new URLSearchParams(location.search), CW=14, D=420, DX=450, DY=260, MARG=70, BANDA=110, VEL=+(Q.get("vel")||7), FPS=12;
const W=2*DX+D+2*MARG, H=Math.round(7.8*DY+D+2*MARG+BANDA), NC=Math.ceil(W/CW);
const CHIARO="236,242,252", LIEVE="127,162,220", MODI=["alterna","nodi","insieme","diventa"];
const POSTI={"כתר":[0,0],"חכמה":[1,1],"בינה":[-1,1],"דעת":[0,2],"חסד":[1,3],"גבורה":[-1,3],"תפארת":[0,4],"נצח":[1,5],"הוד":[-1,5],"יסוד":[0,6],"מלכות":[0,7.8]};
const centro=w=>[W/2+POSTI[w][0]*DX,MARG+D/2+POSTI[w][1]*DY];
const SISTEMI={
  a:{nome:"1 · Albero ermetico",frase:"le lettere in ordine dall'alto al basso, da alef a tav; due sentieri scendono fino a Malkhut dai lati",
    sentieri:[["א","כתר","חכמה"],["ב","כתר","בינה"],["ג","כתר","תפארת"],["ד","חכמה","בינה"],["ה","חכמה","תפארת"],["ו","חכמה","חסד"],["ז","בינה","תפארת"],["ח","בינה","גבורה"],["ט","חסד","גבורה"],["י","חסד","תפארת"],["כ","חסד","נצח"],
      ["ל","גבורה","תפארת"],["מ","גבורה","הוד"],["נ","תפארת","נצח"],["ס","תפארת","יסוד"],["ע","תפארת","הוד"],["פ","נצח","הוד"],["צ","נצח","יסוד"],["ק","נצח","מלכות"],["ר","הוד","יסוד"],["ש","הוד","מלכות"],["ת","יסוד","מלכות"]]},
  b:{nome:"2 · Albero dell'Ari",frase:"le tre madri sui sentieri orizzontali, le sette doppie sui verticali, le dodici semplici sulle diagonali; Malkhut pende da Yesod soltanto",
    sentieri:[["ש","חכמה","בינה"],["א","חסד","גבורה"],["מ","נצח","הוד"],["ב","חכמה","חסד"],["ג","בינה","גבורה"],["ד","כתר","תפארת"],["כ","חסד","נצח"],["פ","גבורה","הוד"],["ר","תפארת","יסוד"],["ת","יסוד","מלכות"],["ה","כתר","חכמה"],
      ["ו","כתר","בינה"],["ז","חכמה","תפארת"],["ח","בינה","תפארת"],["ט","חכמה","גבורה"],["י","בינה","חסד"],["ל","חסד","תפארת"],["נ","גבורה","תפארת"],["ס","תפארת","נצח"],["ע","תפארת","הוד"],["צ","נצח","יסוד"],["ק","הוד","יסוד"]]},
};
const cifra=g=>g.length===1&&g>="1"&&g<="9";
function figura(w,r,i){const F=Griglia.figuraDi(w,r),[cx,cy]=centro(w),s=D*0.47/F.raggio;
  const X=p=>cx+(p[0]-F.baricentro[0])*s,Y=p=>cy+(p[1]-F.baricentro[1])*s,tot=new Map();
  const passi=F.tratti.map(t=>{const ax=X(t.da),ay=Y(t.da),bx=X(t.a),by=Y(t.a),n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/2)),m=new Map();
    for(let k=0;k<=n;k++){const c=Math.floor((ax+(bx-ax)*k/n)/CW)+NC*Math.floor((ay+(by-ay)*k/n)/CW);m.set(c,(m.get(c)||0)+1);tot.set(c,(tot.get(c)||0)+1);}
    return {lettera:t.lettera,stanza:t.stanza,celle:[...m],capo:[bx,by]};});
  return {passi,max:Math.max(...tot.values())*0.7,modo:MODI[i%4],stato:new Map(),fatti:0};}
// un sentiero: le celle fra due figure, fuori dal cerchio di ogni figura, nell'ordine dall'alto al basso
function sentiero([lettera,da,a],i){const A=centro(da),B=centro(a),n=Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1])/(CW*0.4)),celle=[],C=Object.keys(POSTI).map(centro);
  for(let k=0;k<=n;k++){const px=A[0]+(B[0]-A[0])*k/n,py=A[1]+(B[1]-A[1])*k/n;if(C.some(c=>Math.hypot(px-c[0],py-c[1])<D/2+CW*0.9))continue;
    const c=Math.floor(px/CW)+NC*Math.floor(py/CW);if(celle[celle.length-1]!==c)celle.push(c);}
  return {lettera,celle,fase:(i*0.377)%1};}
function avanza(A,fino){for(;A.fatti<fino;A.fatti++){const p=A.passi[A.fatti];p.celle.forEach(([k,n],i)=>{
    const g=A.modo==="alterna"?(i%2?String(p.stanza):p.lettera):A.modo==="nodi"?(i===0?String(p.stanza):p.lettera):p.lettera;
    let q=A.stato.get(k);if(!q){q={per:{},volte:[]};A.stato.set(k,q);}q.per[g]=(q.per[g]||0)+n;q.volte.push(A.fatti);});}}
function albero(tela,sistema){
  tela.width=W;tela.height=H;const x=tela.getContext("2d"),strato=document.createElement("canvas");strato.width=W;strato.height=H;const y=strato.getContext("2d");
  const FIG=Griglia.SEFIROT.map(([w,r],i)=>figura(w,r,i)),SEN=sistema.sentieri.map(sentiero),t0=performance.now();
  return function quadro(ora){const t=(ora-t0)/1000,jf=Math.max(0,(t-1.6)*VEL),j=Math.floor(jf),lampo=Math.floor(t*2.2)%2===0;
    y.clearRect(0,0,W,H);y.textAlign="center";y.textBaseline="middle";
    // i sentieri: la lettera ripetuta, lieve, e una luce che la percorre dall'alto al basso
    for(const S of SEN){const n=S.celle.length,pos=((t*0.09+S.fase)%1)*(n+10)-5;
      S.celle.forEach((k,i)=>{const luce=Math.max(0,1-Math.abs(i-pos)/4);
        y.font=`${Math.round(CW*(0.72+luce*0.5))}px "Frank Ruhl Libre"`;y.fillStyle=`rgba(${luce>0.3?CHIARO:LIEVE},${0.3+luce*0.7})`;y.fillText(S.lettera,(k%NC+0.5)*CW,(Math.floor(k/NC)+0.5)*CW);});}
    for(const A of FIG){const tot=A.passi.length,jm=jf%tot;avanza(A,Math.min(j,tot));
      for(const [k,q] of A.stato){const px=(k%NC+0.5)*CW,py=(Math.floor(k/NC)+0.5)*CW;
        let eta=1e9;for(const v of q.volte){const e=((jm-v)%tot+tot)%tot;if(e<eta)eta=e;}
        const scia=Math.max(0,1-eta/18);
        for(const g0 in q.per){const v=Math.min(1,q.per[g0]/A.max),corpo=CW*(0.6+v*1.1);
          const g=A.modo==="diventa"&&scia>0.4?String(Middah.stanza(g0)):g0,alfa=Math.min(1,0.38+v*0.6+scia*0.7);
          y.font=cifra(g)?`${Math.round(corpo*0.8)}px "Space Mono"`:`${Math.round(corpo)}px "Frank Ruhl Libre"`;
          y.fillStyle=`rgba(${scia>0.3||v>0.65?CHIARO:LIEVE},${alfa})`;y.fillText(g,px,py);
          if(A.modo==="insieme"){y.font=`${Math.round(CW*(0.36+v*0.3))}px "Space Mono"`;y.fillStyle=`rgba(${LIEVE},${alfa*0.85})`;y.fillText(String(Middah.stanza(g0)),px+CW*0.36,py+CW*0.34);}}}
      if(j>0){const c=A.passi[(j-1)%tot].capo;y.fillStyle=`rgba(${CHIARO},0.95)`;y.fillRect(c[0]-CW*0.28,c[1]-CW*0.42,CW*0.56,CW*0.84);}}
    const riga="> tree of artificial life",n=Math.max(0,Math.min(riga.length,Math.floor(t*22)));
    y.textAlign="left";y.font=`24px "Space Mono"`;y.fillStyle=`rgba(${LIEVE},0.9)`;y.fillText(riga.slice(0,n),MARG,H-BANDA*0.55);
    if(lampo){y.fillStyle=`rgba(${CHIARO},0.9)`;y.fillText("▮",MARG+y.measureText(riga.slice(0,n)+" ").width,H-BANDA*0.55);}
    x.globalCompositeOperation="source-over";x.globalAlpha=1;x.filter="none";x.fillStyle="#010204";x.fillRect(0,0,W,H);
    x.globalCompositeOperation="lighter";x.filter="blur(8px)";x.globalAlpha=0.75;x.drawImage(strato,0,0);x.filter="none";
    x.globalAlpha=0.88+Math.random()*0.12;x.drawImage(strato,0,0);
    x.globalCompositeOperation="source-over";x.globalAlpha=1;x.fillStyle="rgba(0,0,0,0.3)";for(let r=0;r<H;r+=4)x.fillRect(0,r,W,1.6);};
}
function avvio(){const g=document.getElementById("g"),solo=Q.get("solo"),quadri=[];if(solo)g.className="due solo";
  for(const id of solo&&SISTEMI[solo]?[solo]:["a"] /* sul sito solo l'albero ermetico: i posti delle lettere nell'albero dell'Ari vanno ancora riscontrati */){const d=document.createElement("div"),c=document.createElement("canvas");d.appendChild(c);
    d.insertAdjacentHTML("beforeend",`<div class="m">${SISTEMI[id].nome}</div><div class="r">${SISTEMI[id].frase}</div>`);g.appendChild(d);
    c.onclick=()=>{location.search=solo?"":"?solo="+id;};quadri.push(albero(c,SISTEMI[id]));}
  let ultimo=0;(function giro(ora){if(ora-ultimo>1000/FPS){ultimo=ora;quadri.forEach(q=>q(ora));}requestAnimationFrame(giro);})(performance.now());}
Griglia.pronti().then(avvio,avvio);
</script></body></html>
