<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Tavola 12, la pala e la sua famiglia</title>
<link href="caratteri/caratteri.css" rel="stylesheet">
<style>
body{margin:0;padding:22px 30px 50px;background:#000;color:#DCE6F7;font-family:"Cormorant Garamond",serif}
h1{font-weight:400;font-size:27px;margin:0 0 4px}
p{margin:0 0 14px;font-size:17px;color:#7FA2DC;font-style:italic}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:26px}
.g.uno{display:block}.g.uno canvas{max-height:calc(100vh - 60px);width:auto;max-width:100%;margin:0 auto}
canvas{width:100%;height:auto;display:block;border-radius:50%;cursor:pointer}
.m{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA2DC;margin-top:10px}
.r{font-style:italic;font-size:16px;color:#DCE6F7}
.p{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 20px;align-items:baseline}
.p button{all:unset;cursor:pointer;font-family:"Frank Ruhl Libre",serif;font-size:22px;color:#7FA2DC;border-bottom:1px solid transparent}
.p button.qui{color:#ECF2FC;border-color:#7FA2DC}
.p small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:5px}
</style></head><body>
<h1>Una pala, una sefirah, tutta la sua famiglia</h1>
<p>La pala traccia una figura, la tiene mentre la linea la ripercorre, poi passa alla sorella con i giri seguenti. Comincia dalla figura di partenza e, finito il giro, ricomincia.</p>
<div class="p" id="p"></div>
<div class="g" id="g"></div>
<script src="/meditazioni/middah.js"></script>
<script src="griglia.js"></script>
<script>
const Q=new URLSearchParams(location.search), L=900, N=+(Q.get("col")||44), CW=L/N, FPS=20, PROF=+(Q.get("prof")||0.55)*L, GIRO=+(Q.get("giro")||0.75);
const CHIARO="236,242,252", LIEVE="127,162,220", MODI=["alterna","nodi","insieme","diventa"];
const FONDE=[
  {id:"onda",nome:"1 · Onda",frase:"la linea sale e scende in profondità una volta sola lungo tutto il suo cammino, e torna da dove era partita"},
  {id:"strati",nome:"2 · Strati",frase:"ogni ripetizione della parola sta su un suo piano: la figura diventa una pila di veli"},
  {id:"cupola",nome:"3 · Cupola",frase:"il centro viene avanti e il bordo resta indietro, come una volta vista da sotto"},
].filter(f=>f.id==="strati");
const TIENI=+(Q.get("tieni")||7);
const cifra=g=>g.length===1&&g>="1"&&g<="9";
// ogni tratto lascia le sue lettere nelle celle che percorre; ogni lettera ricorda la sua distanza
function prepara(F,modo){const s=L*0.36/F.raggio,X=p=>(p[0]-F.baricentro[0])*s,Y=p=>(p[1]-F.baricentro[1])*s,tot=new Map(),nt=F.tratti.length;
  const passi=F.tratti.map((t,j)=>{const ax=X(t.da),ay=Y(t.da),bx=X(t.a),by=Y(t.a),n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/2)),m=new Map();
    for(let i=0;i<=n;i++){const cx=Math.floor((ax+(bx-ax)*i/n)/CW),cy=Math.floor((ay+(by-ay)*i/n)/CW),k=cx+"|"+cy;if(!m.has(k))m.set(k,{cx,cy,n:0,u:i/n});m.get(k).n++;tot.set(k,(tot.get(k)||0)+1);}
    const celle=[...m.values()].map((c,i)=>{const px=(c.cx+0.5)*CW,py=(c.cy+0.5)*CW,ro=Math.hypot(px,py)/(L*0.36),a=(j+c.u)/nt;
      const g=modo==="alterna"?(i%2?String(t.stanza):t.lettera):modo==="nodi"?(i===0?String(t.stanza):t.lettera):t.lettera;
      return {k:c.cx+"|"+c.cy+"|"+g,x:px,y:py,n:c.n,g,lettera:t.lettera,z:{onda:Math.sin(a*2*Math.PI)*0.5,strati:F.r>1?t.q/(F.r-1)-0.5:0,cupola:0.5-ro}};});
    return {lettera:t.lettera,stanza:t.stanza,celle,capo:[bx,by],q:t.q};});
  return {F,passi,max:Math.max(...tot.values())*0.7,modo,conti:new Map(),fatti:0};}
let P, tele=[], t0=0, quale=0;
const strato=document.createElement("canvas");strato.width=strato.height=L;
function quadro(ora){const t=(ora-t0)/1000,tot=P.passi.length,vel=Math.max(7,tot/15),jf=Math.max(0,(t-0.4)*vel),j=Math.floor(jf),jm=jf%tot;
  if(t>0.4+tot/vel+TIENI){ki=(ki+1)%KK.length;figuraK();return;}
  for(;P.fatti<Math.min(j,tot);P.fatti++)for(const c of P.passi[P.fatti].celle)P.conti.set(c.k,(P.conti.get(c.k)||0)+c.n);
  const an=GIRO*Math.sin(t*0.45),bn=0.22*Math.sin(t*0.29+1),ca=Math.cos(an),sa=Math.sin(an),cb=Math.cos(bn),sb=Math.sin(bn),fuoco=2.4*L;
  for(const T of tele){const y=strato.getContext("2d");y.clearRect(0,0,L,L);y.textAlign="center";y.textBaseline="middle";
    const punto=(px,py,z)=>{const x1=px*ca+z*sa,z1=-px*sa+z*ca,y1=py*cb-z1*sb,z2=py*sb+z1*cb,k=fuoco/(fuoco-z2);return [L/2+x1*k,L/2+y1*k,k,z2];};
    for(let i=0;i<P.fatti;i++){const p=P.passi[i],eta=((jm-i)%tot+tot)%tot,scia=Math.max(0,1-eta/18);
      for(const c of p.celle){const v=Math.min(1,P.conti.get(c.k)/P.max),[sx,sy,k,z2]=punto(c.x,c.y,c.z[T.f.id]*PROF),vicino=0.55+0.45*(z2/(PROF*0.6)+0.5);
        const g=P.modo==="diventa"&&scia>0.4?String(Middah.stanza(c.lettera)):c.g,corpo=CW*(0.6+v*1.1)*k,alfa=Math.min(1,(0.2+v*0.35)*Math.max(0.25,vicino)+scia*0.8);
        y.font=cifra(g)?`${Math.round(corpo*0.8)}px "Space Mono"`:`${Math.round(corpo)}px "Frank Ruhl Libre"`;
        y.fillStyle=`rgba(${scia>0.3||v>0.65?CHIARO:LIEVE},${alfa})`;y.fillText(g,sx,sy);
        if(P.modo==="insieme"){y.font=`${Math.round(CW*0.4*k)}px "Space Mono"`;y.fillStyle=`rgba(${LIEVE},${alfa*0.8})`;y.fillText(String(Middah.stanza(c.lettera)),sx+CW*0.36*k,sy+CW*0.34*k);}}}
    if(j>0){const p=P.passi[(j-1)%tot],u=p.celle[p.celle.length-1],[sx,sy,k]=punto(u.x,u.y,u.z[T.f.id]*PROF);y.fillStyle=`rgba(${CHIARO},0.95)`;y.fillRect(sx-CW*0.28*k,sy-CW*0.42*k,CW*0.56*k,CW*0.84*k);}
    const x=T.x;x.globalCompositeOperation="source-over";x.globalAlpha=1;x.filter="none";x.fillStyle="#000";x.fillRect(0,0,L,L);
    x.globalCompositeOperation="lighter";x.filter="blur(9px)";x.globalAlpha=0.8;x.drawImage(strato,0,0);x.filter="none";x.globalAlpha=1;x.drawImage(strato,0,0);
  }
}
let KK=[],ki=0;
function figuraK(){const [w,r]=Griglia.SEFIROT[quale];P=prepara(Middah.figura(w,{r,k:KK[ki]}),Q.get("modo")||MODI[quale%4]);t0=performance.now();
  document.getElementById("et").textContent=`figura ${ki+1} di ${KK.length} · ${KK[ki]} giri · svolta ${Griglia.virgola(P.F.theta_gradi,1)}°`;}
function parola(i){quale=i;const [w,r]=Griglia.SEFIROT[i],m=Middah.pulisci(w).length;KK=Middah.kAmmessi(r,m).filter(k=>k<=r*m/2);ki=Math.max(0,KK.indexOf(Griglia.kVicino(r,m)));figuraK();
  [...document.querySelectorAll("#p button")].forEach((b,n)=>b.classList.toggle("qui",n===i));}
function avvio(){const p=document.getElementById("p"),g=document.getElementById("g");if(FONDE.length===1)g.className="g uno";
  Griglia.SEFIROT.forEach(([w,r,nome],i)=>{const b=document.createElement("button");b.innerHTML=`${w}<small>${nome}</small>`;b.onclick=()=>parola(i);p.appendChild(b);});
  for(const f of FONDE){const d=document.createElement("div"),c=document.createElement("canvas");c.width=c.height=L;d.appendChild(c);
    c.onclick=()=>{ki=(ki+1)%KK.length;figuraK();};
    d.insertAdjacentHTML("beforeend",`<div class="m" id="et" style="text-align:center"></div>`);g.appendChild(d);tele.push({x:c.getContext("2d"),f});}
  parola(+(Q.get("n")||0));
  let ultimo=0;(function giro(ora){if(ora-ultimo>1000/FPS){ultimo=ora;quadro(ora);}requestAnimationFrame(giro);})(performance.now());}
Griglia.pronti().then(avvio,avvio);
</script></body></html>
