<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Tavola 15, tre proposte meditative</title>
<link href="caratteri/caratteri.css" rel="stylesheet">
<style>
body{margin:0;padding:22px 30px 50px;background:#000;color:#DCE6F7;font-family:"Cormorant Garamond",serif}
h1{font-weight:400;font-size:27px;margin:0 0 4px}
p{margin:0 0 14px;font-size:17px;color:#7FA2DC;font-style:italic}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:26px}
.g.uno{display:block}.g.uno canvas{max-height:calc(100vh - 60px);width:auto;max-width:100%;margin:0 auto}
canvas{width:100%;height:auto;display:block;cursor:pointer}
.m{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA2DC;margin-top:10px}
.r{font-style:italic;font-size:16px;color:#DCE6F7}
.p{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 20px;align-items:baseline}
.p button{all:unset;cursor:pointer;font-family:"Frank Ruhl Libre",serif;font-size:22px;color:#7FA2DC;border-bottom:1px solid transparent}
.p button.qui{color:#ECF2FC;border-color:#7FA2DC}
.p small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:5px}
</style></head><body>
<h1>La stessa famiglia, lenta</h1>
<p>Tre modi di far respirare le figure di una sefirah. Nessuno torna mai al nero. Un tocco su una tela la apre da sola.</p>
<div class="p" id="p"></div>
<div class="g" id="g"></div>
<script src="/meditazioni/middah.js"></script>
<script src="griglia.js?v=2"></script>
<script>
/* Tre proposte meditative sulla famiglia di una sefirah: polvere che migra, respiro, memoria della linea.
   ?n= parola da 0 a 10, ?modo=polvere|respiro|memoria, ?lento= moltiplica tutti i tempi. */
const Q=new URLSearchParams(location.search), L=900, FPS=20, LENTO=+(Q.get("lento")||1);
const CHIARO="236,242,252", LIEVE="127,162,220";
const MODI=[
  {id:"polvere",nome:"1 · Polvere",frase:"le lettere sono pulviscolo intorno alla linea e non si spengono mai: quando viene la sorella, ogni granello migra piano al suo posto nuovo"},
  {id:"respiro",nome:"2 · Respiro",frase:"la figura è tutta presente e un'onda di luce la percorre come un fiato; la sorella affiora mentre lei si ritira"},
  {id:"memoria",nome:"3 · Memoria",frase:"la figura intera sta in fondo, appena visibile; la linea la riscrive lentamente e ciò che ha toccato resta acceso a lungo prima di tornare ombra"},
].filter(m=>!Q.get("modo")||m.id===Q.get("modo"));
let quale=0,KK=[];
const figura=i=>{const [w,r]=Griglia.SEFIROT[quale];return Middah.figura(w,{r,k:KK[((i%KK.length)+KK.length)%KK.length]});};
const dolce=e=>e*e*(3-2*e), caso=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
// la linea come granelli: M punti a distanza uguale lungo tutto il cammino, ognuno con la lettera del suo tratto
function granelli(F,M){const s=L*0.42/F.raggio,X=p=>L/2+(p[0]-F.baricentro[0])*s,Y=p=>L/2+(p[1]-F.baricentro[1])*s,tot=F.numeri.lunghezza,out=[];let t=0,fatta=0;
  for(let i=0;i<M;i++){const d=(i+0.5)/M*tot;while(fatta+F.tratti[t].stanza<d){fatta+=F.tratti[t].stanza;t++;}
    const T=F.tratti[t],u=(d-fatta)/T.stanza;out.push([X(T.da)+(X(T.a)-X(T.da))*u,Y(T.da)+(Y(T.a)-Y(T.da))*u,T.lettera]);}
  return out;}
// la linea sulla griglia: per ogni cella le lettere, quanta linea, e i punti del cammino in cui la linea la tocca
function celle(F,N){const cw=L/N,s=L*0.42/F.raggio,X=p=>L/2+(p[0]-F.baricentro[0])*s,Y=p=>L/2+(p[1]-F.baricentro[1])*s,C=new Map(),nt=F.tratti.length;let max=0;
  F.tratti.forEach((t,j)=>{const ax=X(t.da),ay=Y(t.da),bx=X(t.a),by=Y(t.a),n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/2));
    for(let i=0;i<=n;i++){const k=Math.floor((ax+(bx-ax)*i/n)/cw)+N*Math.floor((ay+(by-ay)*i/n)/cw);let q=C.get(k);if(!q){q={per:{},n:0,u:[]};C.set(k,q);}
      q.per[t.lettera]=(q.per[t.lettera]||0)+1;q.n++;const u=(j+i/n)/nt;if(!q.u.length||Math.abs(q.u[q.u.length-1]-u)>0.004)q.u.push(u);if(q.n>max)max=q.n;}});
  return {C,max:max*0.7,cw,N};}
function scriviCelle(x,G,forza,luce){for(const [k,q] of G.C){const l=luce(q);for(const g in q.per){const v=Math.min(1,q.per[g]/G.max),a=forza*Math.min(1,(0.16+v*0.3)+l*0.75);if(a<0.012)continue;
      x.font=`${Math.round(G.cw*(0.6+v*1.1))}px "Frank Ruhl Libre"`;x.fillStyle=`rgba(${l>0.45||v>0.75?CHIARO:LIEVE},${a})`;x.fillText(g,(k%G.N+0.5)*G.cw,(Math.floor(k/G.N)+0.5)*G.cw);}}}
const QUADRI={
  polvere(T,t){const M=1500,TIENI=9*LENTO,MIGRA=11*LENTO;if(!T.a){T.i=T.i0;T.a=granelli(figura(T.i),M);T.b=granelli(figura(T.i+1),M);T.t0=t;T.g=Array.from({length:M},()=>[(caso()+caso()+caso()-1.5)*13,(caso()+caso()+caso()-1.5)*13,caso()*6.28,0.25+caso()*0.5,Math.round(8+caso()*caso()*16),0.18+caso()*0.5]);}
    let e=(t-T.t0-TIENI)/MIGRA;if(e>=1){T.i++;T.a=T.b;T.b=granelli(figura(T.i+1),M);T.t0=t-0.001;e=-1;}e=e<0?0:dolce(e);
    const x=T.y;for(let i=0;i<M;i++){const A=T.a[i],B=T.b[i],g=T.g[i],px=A[0]+(B[0]-A[0])*e+g[0]+4*Math.sin(t*g[3]/LENTO+g[2]),py=A[1]+(B[1]-A[1])*e+g[1]+4*Math.cos(t*g[3]*0.8/LENTO+g[2]);
      x.font=`${g[4]}px "Frank Ruhl Libre"`;x.fillStyle=`rgba(${g[4]>17?CHIARO:LIEVE},${g[5]*(0.75+0.25*Math.sin(t*g[3]*1.7/LENTO+g[2]*2))})`;x.fillText(e<0.5?A[2]:B[2],px,py);}},
  respiro(T,t){const TIENI=12*LENTO,AFFIORA=9*LENTO,FIATO=8*LENTO;if(!T.a){T.i=T.i0;T.a=celle(figura(T.i),60);T.b=celle(figura(T.i+1),60);T.t0=t;}
    let e=(t-T.t0-TIENI)/AFFIORA;if(e>=1){T.i++;T.a=T.b;T.b=celle(figura(T.i+1),60);T.t0=t-0.001;e=-1;}e=e<0?0:dolce(e);
    const onda=q=>{let m=0;for(const u of q.u){const d=Math.abs(((u-t/FIATO)%1+1.5)%1-0.5);m=Math.max(m,Math.exp(-d*d*38));}return m;};
    scriviCelle(T.y,T.a,1-e,onda);if(e>0)scriviCelle(T.y,T.b,e,onda);},
  memoria(T,t){const TIENI=26*LENTO,AFFIORA=10*LENTO,GIRO=34*LENTO,RICORDO=0.3;if(!T.a){T.i=T.i0;T.a=celle(figura(T.i),50);T.b=celle(figura(T.i+1),50);T.t0=t;}
    let e=(t-T.t0-TIENI)/AFFIORA;if(e>=1){T.i++;T.a=T.b;T.b=celle(figura(T.i+1),50);T.t0=t-0.001;e=-1;}e=e<0?0:dolce(e);
    const testa=(t/GIRO)%1,ricordo=q=>{let m=0;for(const u of q.u){const d=((testa-u)%1+1)%1;m=Math.max(m,d<0.004?1:Math.exp(-d/RICORDO*4));}return m;};
    scriviCelle(T.y,T.a,1-e,ricordo);if(e>0)scriviCelle(T.y,T.b,e,ricordo);},
};
const tele=[];
function quadro(t){for(const T of tele){const y=T.y;y.clearRect(0,0,L,L);y.textAlign="center";y.textBaseline="middle";QUADRI[T.m.id](T,t);
    const x=T.x;x.globalCompositeOperation="source-over";x.globalAlpha=1;x.filter="none";x.fillStyle="#000";x.fillRect(0,0,L,L);
    x.globalCompositeOperation="lighter";x.filter="blur(10px)";x.globalAlpha=0.7;x.drawImage(T.s,0,0);x.filter="none";x.globalAlpha=1;x.drawImage(T.s,0,0);}}
function parola(i){quale=i;const [w,r]=Griglia.SEFIROT[i],m=Middah.pulisci(w).length;KK=Middah.kAmmessi(r,m).filter(k=>k<=r*m/2);
  for(const T of tele){T.a=null;T.i0=Math.max(0,KK.indexOf(Griglia.kVicino(r,m)));}
  [...document.querySelectorAll("#p button")].forEach((b,n)=>b.classList.toggle("qui",n===i));}
function avvio(){const p=document.getElementById("p"),g=document.getElementById("g");if(MODI.length===1)g.className="g uno";
  Griglia.SEFIROT.forEach(([w,r,nome],i)=>{const b=document.createElement("button");b.innerHTML=`${w}<small>${nome}</small>`;b.onclick=()=>parola(i);p.appendChild(b);});
  for(const m of MODI){const d=document.createElement("div"),c=document.createElement("canvas"),s=document.createElement("canvas");c.width=c.height=s.width=s.height=L;d.appendChild(c);
    c.onclick=()=>{location.search=MODI.length===1?`?n=${quale}`:`?n=${quale}&modo=${m.id}`;};
    d.insertAdjacentHTML("beforeend",`<div class="m">${m.nome}</div><div class="r">${m.frase}</div>`);g.appendChild(d);tele.push({x:c.getContext("2d"),s,y:s.getContext("2d"),m});}
  parola(+(Q.get("n")||0));
  let ultimo=0;(function giro(ora){if(ora-ultimo>1000/FPS){ultimo=ora;quadro(ora/1000);}requestAnimationFrame(giro);})(performance.now());}
Griglia.pronti().then(avvio,avvio);
</script></body></html>
